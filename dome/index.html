<title>Dome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style id="app-style">
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
:root{
  --ink:#05070C; --slab:#0B1220; --slab-2:#111D31; --line:#16233A; --line-2:#22344F;
  --text:#E8EDF7; --muted:#7C8CA8; --gold:#F0B429; --gold-dim:#8A6612;
  --r:14px;
  --composer-h:178px;
}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--ink); color:var(--text);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:17px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
  min-height:100dvh;
  overscroll-behavior-y:none;
}
button,input,textarea{font:inherit;color:inherit;background:none;border:none;margin:0}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}

.shell{max-width:560px;margin:0 auto;padding:0 16px;padding-bottom:calc(var(--composer-h) + env(safe-area-inset-bottom,0px))}

/* ---------- header ---------- */
.top{
  position:sticky;top:0;z-index:20;background:var(--ink);
  padding:22px 0 12px;
  border-bottom:1px solid var(--line);
}
.top-row{display:flex;align-items:flex-end;justify-content:space-between;gap:14px}
.date{
  font-family:"Archivo",system-ui,sans-serif;font-weight:800;
  font-size:30px;line-height:1;letter-spacing:-.035em;margin:0;
  text-wrap:balance;
}
.date span{color:var(--gold)}
.weekday{
  font-size:13px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);margin-top:8px;
}
.tally{text-align:right;flex:none}
.tally-n{font-family:"Archivo",sans-serif;font-weight:800;font-size:26px;line-height:1;letter-spacing:-.03em}
.tally-l{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.bar{height:3px;background:var(--line);border-radius:2px;margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:2px;transition:width .35s ease}
.saved{
  font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  margin-top:10px;display:flex;align-items:center;gap:7px;min-height:16px;
}
.saved b{width:6px;height:6px;border-radius:50%;background:var(--line-2);flex:none}
.saved[data-s="saving"] b{background:var(--gold)}
.saved[data-s="saved"] b{background:#2E6B4A}
.saved[data-s="error"]{color:#E4907F}
.saved[data-s="error"] b{background:#E4907F}

/* ---------- sections ---------- */
.sec{margin-top:30px}
.sec-head{display:flex;align-items:baseline;gap:10px;padding:0 2px 10px}
.sec-title{font-size:13px;font-weight:600;letter-spacing:.18em;text-transform:uppercase}
.sec-count{font-size:13px;color:var(--muted)}
.sec-hint{font-size:13px;color:var(--muted);margin-left:auto}
.sec[data-b="today"] .sec-title{color:var(--gold)}

.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}

.task{
  background:var(--slab);border:1px solid var(--line);border-radius:var(--r);
  display:flex;align-items:flex-start;gap:2px;min-height:60px;
  transition:border-color .18s ease,background .18s ease;
}
.task.is-done{background:transparent;border-color:var(--line)}
.check{
  flex:none;width:52px;min-height:58px;display:flex;align-items:center;justify-content:center;
  align-self:stretch;border-radius:var(--r) 0 0 var(--r);
}
.box{
  width:26px;height:26px;border-radius:50%;border:2px solid var(--line-2);
  display:flex;align-items:center;justify-content:center;transition:all .18s ease;
}
.check:active .box{transform:scale(.88)}
.is-done .box{background:var(--gold);border-color:var(--gold)}
.box svg{width:14px;height:14px;opacity:0;transition:opacity .18s ease}
.is-done .box svg{opacity:1}

.txt{
  flex:1;min-width:0;text-align:left;padding:17px 4px 17px 0;
  font-size:17px;line-height:1.4;word-break:break-word;
}
.is-done .txt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--gold-dim)}
.txt-edit{
  flex:1;min-width:0;padding:16px 4px 16px 0;font-size:17px;line-height:1.4;
  width:100%;resize:none;overflow:hidden;
  border-bottom:2px solid var(--gold);
}
.more{
  flex:none;width:46px;align-self:stretch;display:flex;align-items:center;justify-content:center;
  color:var(--muted);border-radius:0 var(--r) var(--r) 0;
}
.more svg{width:18px;height:18px}

.acts{display:flex;flex-wrap:wrap;gap:8px;padding:0 12px 12px 52px}
.act{
  font-family:"IBM Plex Mono",monospace;font-size:13px;letter-spacing:.06em;
  padding:10px 13px;border:1px solid var(--line-2);border-radius:9px;color:var(--muted);
  min-height:40px;
}
.act:active{background:var(--slab-2)}
.act.danger{color:#E4907F;border-color:#4A2622}

.empty{
  border:1px dashed var(--line-2);border-radius:var(--r);padding:20px 18px;
  color:var(--muted);font-size:15px;
}
.clear{
  margin-top:10px;font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);padding:10px 2px;min-height:40px;
}

/* ---------- composer ---------- */
.composer{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:linear-gradient(to bottom,rgba(5,7,12,0) 0%,var(--ink) 26%);
  padding:22px 16px calc(14px + env(safe-area-inset-bottom,0px));
}
.composer-in{max-width:560px;margin:0 auto}
.chips{display:flex;gap:8px;margin-bottom:9px}
.chip{
  font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  padding:11px 15px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted);
  min-height:42px;
}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#20180A;font-weight:600}
.field{
  display:flex;align-items:flex-end;gap:10px;
  background:var(--slab);border:1px solid var(--line-2);border-radius:var(--r);
  padding:8px 8px 8px 16px;
}
.field:focus-within{border-color:var(--gold)}
#input{
  flex:1;min-width:0;resize:none;overflow-y:auto;max-height:132px;
  font-size:17px;line-height:1.4;padding:12px 0;
}
#input::placeholder{color:#5C6A85}
.send{
  flex:none;width:46px;height:46px;border-radius:11px;background:var(--gold);
  display:flex;align-items:center;justify-content:center;transition:opacity .18s ease,transform .12s ease;
}
.send:active{transform:scale(.92)}
.send[disabled]{opacity:.28;cursor:default}
.send svg{width:20px;height:20px;color:#20180A}

.toast{
  position:fixed;left:50%;bottom:calc(var(--composer-h) + 12px);transform:translateX(-50%) translateY(8px);
  background:var(--slab-2);border:1px solid var(--line-2);color:var(--text);
  font-size:14px;padding:11px 16px;border-radius:10px;z-index:40;
  opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;
  max-width:calc(100% - 32px);text-align:center;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.foot{padding:34px 2px 10px;color:var(--muted);font-size:12px;letter-spacing:.1em;text-transform:uppercase}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app"></div>
<script id="app-state" type="application/json">{"v":1,"tasks":[],"updatedAt":null}</script>
<script id="app-src">
(function(){
  "use strict";

  /* sessionStorage can throw (private windows, blocked site data, thumbnailers) */
  function ssGet(k){ try { return sessionStorage.getItem(k); } catch(e){ return null; } }
  function ssSet(k,v){ try { sessionStorage.setItem(k,v); } catch(e){} }
  function ssDel(k){ try { sessionStorage.removeItem(k); } catch(e){} }

  var FONT_URL = "https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap";

  var BUCKETS = [
    { id:"today", label:"Hoje",      hint:"sai hoje" },
    { id:"week",  label:"Semana",    hint:"até domingo" },
    { id:"none",  label:"Sem data",  hint:"quando der" }
  ];
  var BLABEL = { today:"Hoje", week:"Esta semana", none:"Sem data" };

  /* ---------- state ---------- */
  var state;
  try {
    state = JSON.parse(document.getElementById("app-state").textContent);
  } catch (e) {
    state = { v:1, tasks:[], updatedAt:null };
  }
  if (!state || !Array.isArray(state.tasks)) state = { v:1, tasks:[], updatedAt:null };

  var app = document.getElementById("app");
  var draftBucket = ssGet("dome.bucket") || "today";
  var openMenu = null;
  var editing = null;
  var saveStatus = "idle";
  var canWrite = true;
  var artifactApi = null;
  var saveTimer = null;
  var retried = false;

  /* ---------- helpers ---------- */
  function esc(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
      .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  function uid(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }
  function fold(s){
    return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
  }
  function byBucket(b){
    return state.tasks.filter(function(t){ return t.bucket === b; });
  }

  /* ---------- quick-add parser (pt-BR) ---------- */
  var RULES = [
    { b:"today", words:["hoje","hj","agora","today"] },
    { b:"week",  words:["amanha","semana","estasemana","essasemana","proximasemana","segunda","terca","quarta","quinta","sexta","sabado","domingo","seg","ter","qua","qui","sex","sab","dom","week"] },
    { b:"none",  words:["semdata","algumdia","qualquerhora","depois","backlog","someday","futuro"] }
  ];

  function detect(line, fallback){
    var bucket = null;
    var text = line;

    // leading marker:  "hoje: ligar"  /  "semana - ler"  /  "sem data ligar"
    var lead = /^\s*(sem\s+data|esta\s+semana|essa\s+semana|pr[oó]xima\s+semana|algum\s+dia|qualquer\s+hora|[a-zA-ZÀ-ÿ]+)\s*(?:[:\-–—]\s*|\s+)/;
    var m = text.match(lead);
    if (m) {
      var key = fold(m[1]).replace(/\s+/g,"");
      for (var i=0;i<RULES.length;i++){
        if (RULES[i].words.indexOf(key) !== -1) {
          bucket = RULES[i].b;
          text = text.slice(m[0].length);
          break;
        }
      }
    }
    // trailing marker: "ligar pro professor, hoje"
    if (!bucket) {
      var tail = /[\s,]+(sem\s+data|esta\s+semana|essa\s+semana|algum\s+dia|[a-zA-ZÀ-ÿ]+)\s*$/;
      var m2 = text.match(tail);
      if (m2) {
        var key2 = fold(m2[1]).replace(/\s+/g,"");
        for (var j=0;j<RULES.length;j++){
          if (RULES[j].words.indexOf(key2) !== -1) {
            bucket = RULES[j].b;
            text = text.slice(0, m2.index);
            break;
          }
        }
      }
    }
    text = text.replace(/^\s*[-*•·–—]\s*/,"").replace(/^\s*\d+[.)]\s*/,"").trim();
    return { text:text, bucket: bucket || fallback };
  }

  function parseInput(raw, fallback){
    return raw.split(/\r?\n/)
      .map(function(l){ return detect(l, fallback); })
      .filter(function(o){ return o.text.length > 0; });
  }

  /* ---------- persistence ---------- */
  function fullDocument(json){
    var style = document.getElementById("app-style").textContent;
    var src   = document.getElementById("app-src").textContent;
    return '<!doctype html>\n<html lang="pt-BR">\n<head>\n'
      + '<meta charset="utf-8">\n'
      + '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n'
      + '<meta name="theme-color" content="#05070C">\n'
      + '<title>Dome</title>\n'
      + '<link rel="preconnect" href="https://fonts.googleapis.com">\n'
      + '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'
      + '<link rel="stylesheet" href="' + FONT_URL + '">\n'
      + '<style id="app-style">' + style + '<\/style>\n'
      + '</head>\n<body>\n'
      + '<div id="app"></div>\n'
      + '<script id="app-state" type="application/json">' + json + '<\/script>\n'
      + '<script id="app-src">' + src + '<\/script>\n'
      + '</body>\n</html>';
  }

  function encodeState(){
    state.updatedAt = new Date().toISOString();
    return JSON.stringify(state)
      .replace(/</g,"\\u003c")
      .replace(/\u2028/g,"\\u2028")
      .replace(/\u2029/g,"\\u2029");
  }

  function setStatus(s){ saveStatus = s; paintStatus(); }

  function paintStatus(){
    var el = document.getElementById("saved");
    if (!el) return;
    var map = {
      idle:"", saving:"salvando", saved:"salvo",
      error:"não salvou — tente de novo", ro:"somente leitura"
    };
    el.setAttribute("data-s", saveStatus);
    el.innerHTML = '<b></b>' + esc(map[saveStatus] || "");
  }

  function scheduleSave(){
    if (!canWrite) { setStatus("ro"); return; }
    setStatus("saving");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(commit, 1400);
  }

  function commit(){
    if (!artifactApi || !canWrite) return;
    var draft = document.getElementById("input");
    if (draft) ssSet("dome.draft", draft.value);
    ssSet("dome.scroll", String(window.scrollY));

    artifactApi.publish(fullDocument(encodeState())).then(function(){
      setStatus("saved");
    })["catch"](function(err){
      var code = (err && err.code) || "upstream_error";
      if (code === "conflict") { return; }               // shell reloads to the winner
      if (code === "rate_limited") {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(commit, 6000);
        return;
      }
      if (code === "not_granted" || code === "not_writer" || code === "not_declared" ||
          code === "capability_disabled" || code === "capability_removed") {
        canWrite = false; setStatus("ro"); render();
        return;
      }
      if (!retried) {
        retried = true;
        setTimeout(commit, 1200 + Math.random()*900);
        return;
      }
      setStatus("error");
    });
  }

  /* ---------- mutations ---------- */
  function addTasks(raw){
    var items = parseInput(raw, draftBucket);
    if (!items.length) return 0;
    var now = new Date().toISOString();
    items.forEach(function(it){
      state.tasks.push({ id:uid(), text:it.text, bucket:it.bucket, done:false, createdAt:now });
    });
    scheduleSave(); render();
    return items.length;
  }
  function toggle(id){
    var t = state.tasks.find(function(x){ return x.id === id; });
    if (!t) return;
    t.done = !t.done;
    scheduleSave(); render();
  }
  function move(id, b){
    var t = state.tasks.find(function(x){ return x.id === id; });
    if (!t) return;
    t.bucket = b; openMenu = null;
    scheduleSave(); render();
    toast("Movida para " + BLABEL[b]);
  }
  function remove(id){
    state.tasks = state.tasks.filter(function(x){ return x.id !== id; });
    openMenu = null;
    scheduleSave(); render();
    toast("Tarefa excluída");
  }
  function rename(id, text){
    var t = state.tasks.find(function(x){ return x.id === id; });
    if (!t) return;
    text = text.trim();
    if (!text || text === t.text) { editing = null; render(); return; }
    t.text = text; editing = null;
    scheduleSave(); render();
  }
  function clearDone(b){
    var n = state.tasks.length;
    state.tasks = state.tasks.filter(function(x){ return !(x.bucket === b && x.done); });
    if (state.tasks.length === n) return;
    scheduleSave(); render();
    toast("Concluídas removidas");
  }

  /* ---------- toast ---------- */
  var toastEl, toastTimer;
  function toast(msg){
    if (!toastEl){
      toastEl = document.createElement("div");
      toastEl.className = "toast";
      toastEl.setAttribute("role","status");
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = msg;
    toastEl.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("on"); }, 2000);
  }

  /* ---------- render ---------- */
  var TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="#20180A" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
  var DOTS = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>';
  var ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';

  function taskHtml(t){
    var isEdit = editing === t.id;
    var h = '<li class="task' + (t.done ? " is-done" : "") + '" data-id="' + t.id + '">';
    h += '<div style="display:flex;align-items:flex-start;width:100%">';
    h +=   '<button class="check" data-act="toggle" aria-pressed="' + (t.done?"true":"false")
         + '" aria-label="' + (t.done ? "Marcar como não feita" : "Marcar como feita") + '"><span class="box">' + TICK + '</span></button>';
    if (isEdit){
      h += '<textarea class="txt-edit" data-act="editfield" rows="1" aria-label="Editar tarefa">' + esc(t.text) + '</textarea>';
    } else {
      h += '<button class="txt" data-act="edit">' + esc(t.text) + '</button>';
    }
    h +=   '<button class="more" data-act="menu" aria-label="Opções" aria-expanded="' + (openMenu===t.id?"true":"false") + '">' + DOTS + '</button>';
    h += '</div>';
    if (openMenu === t.id){
      h += '<div class="acts">';
      BUCKETS.forEach(function(b){
        if (b.id !== t.bucket) h += '<button class="act" data-act="move" data-b="' + b.id + '">→ ' + esc(b.label) + '</button>';
      });
      h += '<button class="act danger" data-act="del">Excluir</button>';
      h += '</div>';
    }
    h += '</li>';
    return h;
  }

  function render(){
    var now = new Date();
    var day = now.toLocaleDateString("pt-BR",{ day:"numeric" });
    var mon = now.toLocaleDateString("pt-BR",{ month:"long" });
    var wd  = now.toLocaleDateString("pt-BR",{ weekday:"long" });

    var today = byBucket("today");
    var doneToday = today.filter(function(t){ return t.done; }).length;
    var pct = today.length ? Math.round(doneToday / today.length * 100) : 0;

    var h = '<div class="shell">';

    h += '<header class="top">';
    h +=   '<div class="top-row">';
    h +=     '<div><h1 class="date">' + esc(day) + ' <span>' + esc(mon) + '</span></h1>'
           + '<div class="weekday mono">' + esc(wd) + '</div></div>';
    h +=     '<div class="tally"><div class="tally-n mono">' + doneToday + '/' + today.length + '</div>'
           + '<div class="tally-l">feitas hoje</div></div>';
    h +=   '</div>';
    h +=   '<div class="bar"><i style="width:' + pct + '%"></i></div>';
    h +=   '<div class="saved mono" id="saved"></div>';
    h += '</header>';

    BUCKETS.forEach(function(b){
      var items = byBucket(b.id);
      var open  = items.filter(function(t){ return !t.done; });
      var done  = items.filter(function(t){ return t.done; });
      h += '<section class="sec" data-b="' + b.id + '">';
      h +=   '<div class="sec-head">';
      h +=     '<span class="sec-title">' + esc(BLABEL[b.id]) + '</span>';
      h +=     '<span class="sec-count mono">' + items.length + '</span>';
      h +=     '<span class="sec-hint mono">' + esc(b.hint) + '</span>';
      h +=   '</div>';
      if (!items.length){
        h += '<div class="empty">' + (b.id === "today"
              ? "Nada por hoje ainda. Escreva lá embaixo."
              : "Vazio.") + '</div>';
      } else {
        h += '<ul class="list">';
        open.forEach(function(t){ h += taskHtml(t); });
        done.forEach(function(t){ h += taskHtml(t); });
        h += '</ul>';
        if (done.length) h += '<button class="clear" data-act="cleardone" data-b="' + b.id + '">Limpar ' + done.length + ' concluída' + (done.length>1?"s":"") + '</button>';
      }
      h += '</section>';
    });

    h += '<div class="foot mono">Dome · ' + state.tasks.length + ' tarefa' + (state.tasks.length===1?"":"s") + ' guardada' + (state.tasks.length===1?"":"s") + '</div>';
    h += '</div>';

    // composer
    h += '<div class="composer"><div class="composer-in">';
    h +=   '<div class="chips">';
    BUCKETS.forEach(function(b){
      h += '<button class="chip" data-act="chip" data-b="' + b.id + '" aria-pressed="' + (draftBucket===b.id?"true":"false") + '">' + esc(b.label) + '</button>';
    });
    h +=   '</div>';
    h +=   '<div class="field">';
    h +=     '<textarea id="input" rows="1" placeholder="Escreva uma tarefa…" aria-label="Nova tarefa"></textarea>';
    h +=     '<button class="send" id="send" disabled aria-label="Adicionar">' + ARROW + '</button>';
    h +=   '</div>';
    h += '</div></div>';

    app.innerHTML = h;
    paintStatus();

    var input = document.getElementById("input");
    var draft = ssGet("dome.draft");
    if (draft) { input.value = draft; }
    grow(input);
    syncSend();

    if (editing){
      var ta = app.querySelector('[data-act="editfield"]');
      if (ta){ grow(ta); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
    }
  }

  function grow(el){
    if (!el) return;
    el.style.height = "auto";
    el.style.height = Math.min(el.scrollHeight, 132) + "px";
  }
  function syncSend(){
    var i = document.getElementById("input");
    var s = document.getElementById("send");
    if (i && s) s.disabled = i.value.trim().length === 0;
  }

  /* ---------- events ---------- */
  app.addEventListener("click", function(e){
    var btn = e.target.closest("[data-act]");
    if (!btn) return;
    var act = btn.getAttribute("data-act");
    var li  = btn.closest(".task");
    var id  = li && li.getAttribute("data-id");

    if (act === "chip"){
      draftBucket = btn.getAttribute("data-b");
      ssSet("dome.bucket", draftBucket);
      app.querySelectorAll('[data-act="chip"]').forEach(function(c){
        c.setAttribute("aria-pressed", c.getAttribute("data-b") === draftBucket ? "true" : "false");
      });
      return;
    }
    if (act === "toggle")    { toggle(id); return; }
    if (act === "menu")      { openMenu = (openMenu === id ? null : id); render(); return; }
    if (act === "move")      { move(id, btn.getAttribute("data-b")); return; }
    if (act === "del")       { remove(id); return; }
    if (act === "cleardone") { clearDone(btn.getAttribute("data-b")); return; }
    if (act === "edit")      { editing = id; openMenu = null; render(); return; }
  });

  app.addEventListener("input", function(e){
    if (e.target.id === "input"){
      grow(e.target); syncSend();
      ssSet("dome.draft", e.target.value);
    }
    if (e.target.getAttribute && e.target.getAttribute("data-act") === "editfield") grow(e.target);
  });

  app.addEventListener("keydown", function(e){
    if (e.target.id === "input" && e.key === "Enter" && (e.metaKey || e.ctrlKey)){
      e.preventDefault(); submit();
    }
    if (e.target.getAttribute && e.target.getAttribute("data-act") === "editfield"){
      if (e.key === "Enter" && !e.shiftKey){
        e.preventDefault();
        var li = e.target.closest(".task");
        rename(li.getAttribute("data-id"), e.target.value);
      }
      if (e.key === "Escape"){ editing = null; render(); }
    }
  });

  app.addEventListener("focusout", function(e){
    if (e.target.getAttribute && e.target.getAttribute("data-act") === "editfield"){
      var li = e.target.closest(".task");
      if (li) rename(li.getAttribute("data-id"), e.target.value);
    }
  });

  function submit(){
    var i = document.getElementById("input");
    if (!i) return;
    var n = addTasks(i.value);
    if (!n) return;
    ssDel("dome.draft");
    var ni = document.getElementById("input");
    if (ni){ ni.value = ""; grow(ni); syncSend(); }
    toast(n === 1 ? "1 tarefa adicionada" : n + " tarefas adicionadas");
  }

  app.addEventListener("click", function(e){
    if (e.target.closest("#send")) submit();
  });

  /* ---------- boot ---------- */
  render();

  var sy = ssGet("dome.scroll");
  if (sy){ window.scrollTo(0, parseInt(sy,10) || 0); ssDel("dome.scroll"); }

  if (window.claude && typeof window.claude.use === "function"){
    window.claude.use("artifact").then(function(api){
      artifactApi = api;
      if (!api){ canWrite = false; setStatus("ro"); }
    })["catch"](function(){ canWrite = false; setStatus("ro"); });
  } else {
    canWrite = false; setStatus("ro");
  }
})();
</script>
